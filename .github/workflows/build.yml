name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CEF_VERSION: 151.3.24+g2384915+chromium-151.0.7922.174

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            cef_platform: linux64
            qt_arch: linux_gcc_64
            run_tests: true
          - name: Windows x64
            os: windows-2022
            cef_platform: windows64
            qt_arch: win64_msvc2022_64
            run_tests: false
          - name: macOS arm64
            os: macos-15
            cef_platform: macosarm64
            qt_arch: clang_64
            run_tests: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libx11-dev libxkbcommon-x11-dev xvfb

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.9.1"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cef-cache
        with:
          path: third_party/cef
          key: cef-${{ matrix.cef_platform }}-${{ env.CEF_VERSION }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          python scripts/fetch_cef.py
          --platform "${{ matrix.cef_platform }}"
          --version "${CEF_VERSION}"

      - name: Configure
        shell: bash
        run: >-
          python scripts/configure.py
          --generator Ninja
          --build-dir build-ci
          --build-type Release
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES=arm64' || '' }}

      - name: Build
        run: cmake --build build-ci --parallel 4

      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build-ci --output-on-failure
